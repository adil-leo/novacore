name: Auto Update Deals

on:
  schedule:
    - cron: '0 0 * * *' # Daily update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-deals:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Deals Script
      run: python scraper.py # (Yahan apni python file ka naam confirm kar lena)

    - name: Commit and Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Auto update affiliate deals [skip ci]" || echo "No deal updates found"
        git push
