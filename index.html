<head>

  <meta name="description" content="Discover curated lifetime deals on SaaS and AI tools, updated daily based on Google search trends.">

<meta property="og:type" content="website" />

<!-- Google Rich Snippet Schema (JSON-LD) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Novacore",
  "url": "https://adil-leo.github.io/novacore/",
  "description": "Automated SaaS and AI lifetime deal platform curated by Google Trends interest.",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://adil-leo.github.io/novacore/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

  <style>
    :root {
      --bg-primary: #0b0f17;
      --bg-card: #151c28;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #232d3f;
      --badge-bg: rgba(56, 189, 248, 0.08);
      --badge-text: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--accent);
    }

    .logo span {
      color: var(--accent);
    }

    /* Submit Deal Button in Header */
    .submit-btn {
      background: rgba(56, 189, 248, 0.08);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      background: var(--accent);
      color: #0f172a;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .hero {
      text-align: center;
      padding: 50px 0 30px;
      position: relative;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, rgba(11, 15, 23, 0) 70%);
      z-index: -1;
      pointer-events: none;
    }

    .hero h1 {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      color: #e2e8f0;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 580px;
      margin: 0 auto 26px;
    }

    .search-container {
      max-width: 500px;
      margin: 0 auto 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .trust-bar {
      display: flex;
      justify-content: center;
      gap: 18px;
      font-size: 0.775rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 35px;
    }

    .category-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.825rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-pill.active, .category-pill:hover {
      border-color: var(--accent);
      color: var(--text-main);
      background: rgba(56, 189, 248, 0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      padding-bottom: 40px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.725rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      letter-spacing: 0.5px;
    }

    .rating {
      font-size: 0.775rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .tool-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: #0b0f17;
      border: 1px solid var(--border);
      padding: 4px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0;
      line-height: 1.2;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .price {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .price-old {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: line-through;
      margin-left: 6px;
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      padding: 9px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding-bottom: 60px;
    }

    .page-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .page-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 700;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      grid-column: 1 / -1;
      padding: 40px 0;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 30px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    @media (max-width: 600px) {
      .hero h1 { font-size: 1.5rem; }
      .grid { grid-template-columns: 1fr; }
      .trust-bar { flex-direction: column; gap: 6px; }
      .submit-btn { padding: 6px 12px; font-size: 0.775rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">N</div>
        Novacore<span>.</span>
      </div>
      <a href="https://forms.google.com" target="_blank" rel="noopener" class="submit-btn">+ Submit Deal</a>
    </header>

    <section class="hero">
      <h1>Curated SaaS & Software Deals</h1>
      <p>Handpicked lifetime deals and verified software discounts for creators and startups.</p>
      
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Search software by name or category...">
      </div>

      <div class="trust-bar">
        <span>Verified Deals</span>
        <span>•</span>
        <span>Daily Updated</span>
        <span>•</span>
        <span>Direct Merchant Links</span>
      </div>

      <div class="categories" id="category-container">
        <button class="category-pill active" onclick="filterCategory('All')">All Deals</button>
        <button class="category-pill" onclick="filterCategory('AI Tools')">AI Tools</button>
        <button class="category-pill" onclick="filterCategory('SaaS')">SaaS</button>
        <button class="category-pill" onclick="filterCategory('Marketing')">Marketing</button>
        <button class="category-pill" onclick="filterCategory('Hosting')">Hosting</button>
      </div>
    </section>

    <!-- Deals Grid -->
    <main class="grid" id="deals-container"></main>

    <!-- Page Navigation -->
    <div class="pagination" id="pagination-container"></div>

    <footer>
      <p>© 2026 Novacore. All rights reserved. Affiliate Network Partner.</p>
    </footer>
  </div>

  <script>
    let allDeals = [];
    let filteredDeals = [];
    let currentPage = 1;
    let currentCategory = 'All';
    const itemsPerPage = 9;

    const dealsContainer = document.getElementById('deals-container');
    const paginationContainer = document.getElementById('pagination-container');
    const searchInput = document.getElementById('search-input');

    fetch('deals.json')
      .then(response => response.json())
      .then(deals => {
        allDeals = deals;
        applyFilters();
      })
      .catch(err => console.error("Error loading deals:", err));

    function applyFilters() {
      const query = searchInput.value.toLowerCase().trim();

      filteredDeals = allDeals.filter(deal => {
        const matchesSearch = deal.title.toLowerCase().includes(query) || 
                              deal.description.toLowerCase().includes(query) ||
                              deal.badge.toLowerCase().includes(query);

        const matchesCategory = currentCategory === 'All' || 
                                (deal.category && deal.category.toLowerCase() === currentCategory.toLowerCase()) ||
                                deal.badge.toLowerCase().includes(currentCategory.toLowerCase());

        return matchesSearch && matchesCategory;
      });

      currentPage = 1;
      renderDeals();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.category-pill').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.trim() === cat || (cat === 'All' && btn.innerText.includes('All')));
      });
      applyFilters();
    }

    function renderDeals() {
      dealsContainer.innerHTML = '';
      
      if (filteredDeals.length === 0) {
        dealsContainer.innerHTML = '<p class="no-results">No deals found matching your criteria.</p>';
        paginationContainer.innerHTML = '';
        return;
      }

      const totalPages = Math.ceil(filteredDeals.length / itemsPerPage);
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIdx = (currentPage - 1) * itemsPerPage;
      const pageDeals = filteredDeals.slice(startIdx, startIdx + itemsPerPage);

      dealsContainer.innerHTML = pageDeals.map(deal => {
        const logoUrl = deal.logo || `https://www.google.com/s2/favicons?domain=${deal.link}&sz=128`;
        
        return `
          <article class="card">
            <div>
              <div class="card-header">
                <span class="badge">${deal.badge}</span>
                <span class="rating">Score 4.9 / 5</span>
              </div>
              <div class="card-title-group">
                <img src="${logoUrl}" alt="${deal.title}" class="tool-logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23232d3f%22/></svg>'">
                <h2 class="card-title">${deal.title}</h2>
              </div>
              <p class="card-desc">${deal.description}</p>
            </div>
            <div class="card-footer">
              <div>
                <span class="price">${deal.price}</span>
                <span class="price-old">${deal.old_price}</span>
              </div>
              <a href="${deal.link}" target="_blank" rel="noopener" class="btn">View Deal</a>
            </div>
          </article>
        `;
      }).join('');

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
      }

      let html = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">Prev</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Next</button>`;

      paginationContainer.innerHTML = html;
    }

    function changePage(page) {
      currentPage = page;
      renderDeals();
      window.scrollTo({ top: 250, behavior: 'smooth' });
    }

    searchInput.addEventListener('input', applyFilters);
  </script>
</body>
</html>
