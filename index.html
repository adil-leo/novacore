<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="impact-site-verification" value="7f9ca468-8c1c-4e5c-bc6f-5d0c860bb136">
  <meta name="google-site-verification" content="rJQM3zVnc3SqAqw-SK7iIC2qRMkvGH6I9FFndg6ZKJ0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novacore | Curated Software & SaaS Deals</title>
  <meta name="description" content="Discover curated lifetime deals on SaaS and AI tools, updated daily based on Google search trends.">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230b0f17'/><circle cx='50' cy='50' r='44' fill='%23151c28' stroke='%2338bdf8' stroke-width='6'/><text x='50%' y='58%' dominant-baseline='middle' text-anchor='middle' font-family='Arial, sans-serif' font-size='52' font-weight='900' fill='%2338bdf8'>N</text></svg>">

  <!-- Open Graph / Social Share Preview Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Novacore - Top Trending SaaS & AI Lifetime Deals">
  <meta property="og:description" content="Discover curated lifetime deals on SaaS and AI tools, updated daily based on Google search trends.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&auto=format&fit=crop">
  <meta property="og:url" content="https://adil-leo.github.io/novacore/">

  <!-- Twitter Card Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Novacore - SaaS Deals Powered by Google Trends">
  <meta name="twitter:description" content="Grab top-rated software lifetime offers before they expire.">
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&auto=format&fit=crop">

  <!-- Google Rich Snippet Schema (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Novacore",
    "url": "https://adil-leo.github.io/novacore/",
    "description": "Automated SaaS and AI lifetime deal platform curated by Google Trends interest.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://adil-leo.github.io/novacore/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <style>
    :root {
      --bg-primary: #121824;
      --bg-card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --badge-bg: rgba(56, 189, 248, 0.12);
      --badge-text: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--accent);
    }

    .logo span {
      color: var(--accent);
    }

    .submit-btn {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      background: var(--accent);
      color: #0f172a;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .hero {
      text-align: center;
      padding: 50px 0 30px;
      position: relative;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(18, 24, 36, 0) 70%);
      z-index: -1;
      pointer-events: none;
    }

    .hero h1 {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      color: #f1f5f9;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 580px;
      margin: 0 auto 26px;
    }

    .search-container {
      max-width: 500px;
      margin: 0 auto 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .trust-bar {
      display: flex;
      justify-content: center;
      gap: 18px;
      font-size: 0.775rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 35px;
    }

    .category-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.825rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-pill.active, .category-pill:hover {
      border-color: var(--accent);
      color: var(--text-main);
      background: rgba(56, 189, 248, 0.15);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding-bottom: 40px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      letter-spacing: 0.5px;
    }

    .rating {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .tool-logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 2px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0;
      line-height: 1.2;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .price-old {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: line-through;
      margin-left: 4px;
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.825rem;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding-bottom: 60px;
      flex-wrap: wrap;
    }

    .page-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .page-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 700;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      grid-column: 1 / -1;
      padding: 40px 0;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 30px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    }

    @media (max-width: 600px) {
      .hero h1 { font-size: 1.5rem; }
      .grid { grid-template-columns: 1fr; }
      .trust-bar { flex-direction: column; gap: 6px; }
      .submit-btn { padding: 6px 12px; font-size: 0.775rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">N</div>
        Novacore<span>.</span>
      </div>
      <a href="https://forms.google.com" target="_blank" rel="noopener noreferrer" class="submit-btn">+ Submit Deal</a>
    </header>

    <section class="hero">
      <h1>Curated SaaS & Software Deals</h1>
      <p>Handpicked lifetime deals and verified software discounts for creators and startups.</p>
      
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Search software by name or category..." aria-label="Search software">
      </div>

      <div class="trust-bar">
        <span>Verified Deals</span>
        <span>•</span>
        <span>Daily Updated</span>
        <span>•</span>
        <span>Direct Merchant Links</span>
      </div>

      <div class="categories" id="category-container">
        <button type="button" class="category-pill active" data-category="All">All Deals</button>
        <button type="button" class="category-pill" data-category="Trending Now">🔥 Trending Now</button>
        <button type="button" class="category-pill" data-category="AI Tools">AI Tools</button>
        <button type="button" class="category-pill" data-category="SaaS">SaaS</button>
        <button type="button" class="category-pill" data-category="Marketing">Marketing</button>
        <button type="button" class="category-pill" data-category="Hosting">Hosting</button>
        <button type="button" class="category-pill" data-category="Apps">Apps</button>
        <button type="button" class="category-pill" data-category="Downloads">Downloads</button>
      </div>
    </section>

    <!-- Deals Grid -->
    <main class="grid" id="deals-container" aria-live="polite"></main>

    <!-- Page Navigation -->
    <div class="pagination" id="pagination-container"></div>

    <footer>
      <p>© 2026 Novacore. All rights reserved. Affiliate Network Partner.</p>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let allDeals = [];
      let filteredDeals = [];
      let currentPage = 1;
      let currentCategory = 'All';
      const itemsPerPage = 20;

      const dealsContainer = document.getElementById('deals-container');
      const paginationContainer = document.getElementById('pagination-container');
      const searchInput = document.getElementById('search-input');
      const categoryContainer = document.getElementById('category-container');

      // Helper for dynamic score calculation
      function getScore(deal) {
        if (deal.rating && deal.rating !== '4.9') return deal.rating;
        if (deal.score) return deal.score;
        
        // Generate a dynamic realistic rating based on title length/char codes
        const name = deal.title || deal.name || 'Deal';
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
          hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        const score = 4.4 + (Math.abs(hash) % 6) / 10;
        return score.toFixed(1);
      }

      // Fetch deals data safely
      fetch('deals.json')
        .then(response => {
          if (!response.ok) throw new Error('Network response was not ok');
          return response.json();
        })
        .then(deals => {
          allDeals = Array.isArray(deals) ? deals : [];
          applyFilters();
        })
        .catch(err => {
          console.error("Error loading deals:", err);
          dealsContainer.innerHTML = '<p class="no-results">Unable to load deals right now. Please check back later.</p>';
        });

      function applyFilters() {
        const query = searchInput.value.toLowerCase().trim();

        filteredDeals = allDeals.filter(deal => {
          const title = (deal.title || deal.name || '').toLowerCase();
          const desc = (deal.description || '').toLowerCase();
          const badge = (deal.badge || '').toLowerCase();
          const category = (deal.category || '').toLowerCase();

          const matchesSearch = title.includes(query) || desc.includes(query) || badge.includes(query);
          
          let matchesCategory = false;
          if (currentCategory === 'All') {
            matchesCategory = true;
          } else if (currentCategory === 'Trending Now') {
            matchesCategory = badge.includes('trend') || badge.includes('hot') || badge.includes('popular') || (deal.is_trending === true);
          } else {
            matchesCategory = category === currentCategory.toLowerCase() || badge.includes(currentCategory.toLowerCase());
          }

          return matchesSearch && matchesCategory;
        });

        currentPage = 1;
        renderDeals();
      }

      function renderDeals() {
        dealsContainer.innerHTML = '';

        if (filteredDeals.length === 0) {
          dealsContainer.innerHTML = '<p class="no-results">No deals found matching your criteria.</p>';
          paginationContainer.innerHTML = '';
          return;
        }

        const totalPages = Math.ceil(filteredDeals.length / itemsPerPage);
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIdx = (currentPage - 1) * itemsPerPage;
        const pageDeals = filteredDeals.slice(startIdx, startIdx + itemsPerPage);

        dealsContainer.innerHTML = pageDeals.map(deal => {
          const title = deal.title || deal.name || 'SaaS Tool';
          const fallbackLogo = `https://ui-avatars.com/api/?name=${encodeURIComponent(title)}&background=0284c7&color=ffffff&bold=true&size=128`;
          const logoUrl = deal.image || deal.icon || deal.logo || fallbackLogo;
          const dealLink = deal.affiliate_url || deal.url || deal.link || '#';
          const currentPrice = deal.deal_price || deal.price || '$49';
          const oldPrice = deal.original_price || deal.old_price || '$199';
          const realScore = getScore(deal);

          return `
            <article class="card">
              <div>
                <div class="card-header">
                  <span class="badge">${deal.badge || 'LIFETIME DEAL'}</span>
                  <span class="rating">Score ${realScore} / 5</span>
                </div>
                <div class="card-title-group">
                  <img src="${logoUrl}" alt="${title}" class="tool-logo" loading="lazy" onerror="this.onerror=null;this.src='${fallbackLogo}';">
                  <h2 class="card-title">${title}</h2>
                </div>
                <p class="card-desc">${deal.description || ''}</p>
              </div>
              <div class="card-footer">
                <div>
                  <span class="price">${currentPrice}</span>
                  <span class="price-old">${oldPrice}</span>
                </div>
                <a href="${dealLink}" target="_blank" rel="noopener noreferrer" class="btn">View Deal</a>
              </div>
            </article>
          `;
        }).join('');

        renderPagination(totalPages);
      }

      function renderPagination(totalPages) {
        if (totalPages <= 1) {
          paginationContainer.innerHTML = '';
          return;
        }

        let html = `<button type="button" class="page-btn" ${currentPage === 1 ? 'disabled' : ''} data-page="${currentPage - 1}">Prev</button>`;
        for (let i = 1; i <= totalPages; i++) {
          html += `<button type="button" class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
        }
        html += `<button type="button" class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">Next</button>`;

        paginationContainer.innerHTML = html;
      }

      // Category Delegation Listener
      categoryContainer.addEventListener('click', (e) => {
        const target = e.target.closest('.category-pill');
        if (!target) return;

        currentCategory = target.getAttribute('data-category');
        document.querySelectorAll('.category-pill').forEach(btn => btn.classList.remove('active'));
        target.classList.add('active');

        applyFilters();
      });

      // Pagination Delegation Listener
      paginationContainer.addEventListener('click', (e) => {
        const target = e.target.closest('.page-btn');
        if (!target || target.disabled) return;

        currentPage = parseInt(target.getAttribute('data-page'), 10);
        renderDeals();
        dealsContainer.scrollIntoView({ behavior: 'smooth' });
      });

      // Search input debouncing
      let debounceTimeout;
      searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(applyFilters, 250);
      });
    });
  </script>
</body>
</html>
