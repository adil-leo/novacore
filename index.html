<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novacore | Curated Software & SaaS Deals</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --badge-bg: rgba(56, 189, 248, 0.1);
      --badge-text: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.6;
    }

    .disclosure-bar {
      background-color: #0284c7;
      color: #ffffff;
      font-size: 0.825rem;
      text-align: center;
      padding: 6px 12px;
      font-weight: 500;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .logo span {
      color: var(--accent);
    }

    .hero {
      text-align: center;
      padding: 50px 0 30px;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.8px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 24px;
    }

    /* Search Bar */
    .search-container {
      max-width: 480px;
      margin: 0 auto 10px;
    }

    .search-input {
      width: 100%;
      padding: 12px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      padding: 30px 0;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .price-old {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: line-through;
      margin-left: 6px;
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    /* Pagination Styles */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding-bottom: 60px;
    }

    .page-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .page-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 700;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-btn:hover:not(:disabled):not(.active) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      grid-column: 1 / -1;
      padding: 40px 0;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 30px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    @media (max-width: 600px) {
      .hero h1 { font-size: 1.8rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="disclosure-bar">
    We may earn a commission when you buy through links on our site — at no extra cost to you.
  </div>

  <div class="container">
    <header>
      <div class="logo">Novacore<span>.</span></div>
    </header>

    <section class="hero">
      <h1>Curated SaaS & Software Deals</h1>
      <p>Handpicked lifetime deals and premium software discounts for creators, agencies, and startups.</p>
      
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Search deals by software name or keyword...">
      </div>
    </section>

    <!-- Deals Grid -->
    <main class="grid" id="deals-container"></main>

    <!-- Page Navigation -->
    <div class="pagination" id="pagination-container"></div>

    <footer>
      <p>© 2026 Novacore. All rights reserved. Affiliate Network Partner.</p>
    </footer>
  </div>

  <script>
    let allDeals = [];
    let filteredDeals = [];
    let currentPage = 1;
    const itemsPerPage = 9; // Har page par 9 deals show hongi

    const dealsContainer = document.getElementById('deals-container');
    const paginationContainer = document.getElementById('pagination-container');
    const searchInput = document.getElementById('search-input');

    fetch('deals.json')
      .then(response => response.json())
      .then(deals => {
        allDeals = deals;
        filteredDeals = deals;
        renderDeals();
      })
      .catch(err => console.error("Error loading deals:", err));

    function renderDeals() {
      dealsContainer.innerHTML = '';
      
      if (filteredDeals.length === 0) {
        dealsContainer.innerHTML = '<p class="no-results">No deals found matching your search.</p>';
        paginationContainer.innerHTML = '';
        return;
      }

      const totalPages = Math.ceil(filteredDeals.length / itemsPerPage);
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIdx = (currentPage - 1) * itemsPerPage;
      const endIdx = startIdx + itemsPerPage;
      const pageDeals = filteredDeals.slice(startIdx, endIdx);

      dealsContainer.innerHTML = pageDeals.map(deal => `
        <article class="card">
          <div>
            <div class="card-header">
              <span class="badge">${deal.badge}</span>
            </div>
            <h2 class="card-title">${deal.title}</h2>
            <p class="card-desc">${deal.description}</p>
          </div>
          <div class="card-footer">
            <div>
              <span class="price">${deal.price}</span>
              <span class="price-old">${deal.old_price}</span>
            </div>
            <a href="${deal.link}" target="_blank" rel="noopener" class="btn">View Deal</a>
          </div>
        </article>
      `).join('');

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
      }

      let paginationHTML = `
        <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">Prev</button>
      `;

      for (let i = 1; i <= totalPages; i++) {
        paginationHTML += `
          <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>
        `;
      }

      paginationHTML += `
        <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Next</button>
      `;

      paginationContainer.innerHTML = paginationHTML;
    }

    function changePage(page) {
      currentPage = page;
      renderDeals();
      window.scrollTo({ top: 250, behavior: 'smooth' });
    }

    // Live Search Filter
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      filteredDeals = allDeals.filter(deal => 
        deal.title.toLowerCase().includes(query) || 
        deal.description.toLowerCase().includes(query) ||
        deal.badge.toLowerCase().includes(query)
      );
      currentPage = 1;
      renderDeals();
    });
  </script>
</body>
</html>
